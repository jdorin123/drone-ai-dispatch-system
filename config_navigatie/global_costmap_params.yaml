global_costmap:
  global_frame: map          
  robot_base_frame: base_link 
  
  update_frequency: 2.0       
  publish_frequency: 1.0      
  
  static_map: false           # Fara harta a priori (explorare forestiera procedurala)
  rolling_window: true        
  width: 300.0                
  height: 300.0
  resolution: 0.1             # Rezolutie grid global (10 cm)

  plugins:
    - {name: obstacles, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}