local_costmap:
  global_frame: odom          
  robot_base_frame: base_link 
  
  update_frequency: 10.0      # Bucla de update pt controlerul local (10 Hz)
  publish_frequency: 10.0     
  
  static_map: false           
  rolling_window: true        
  width: 30.0                 
  height: 30.0
  resolution: 0.05            # Rezolutie grid local (5 cm) pt evitare obstacole mai mici

  plugins:
    - {name: obstacles, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}